<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC HTML SETTINGS
         ===================================================== -->

    <meta charset="UTF-8">

    <!-- Mobile responsive setting -->
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#111111">

    <title>TimeNow - Digital Clock</title>


    <!-- =====================================================
         CSS
         ===================================================== -->

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =====================================================
         MAIN CLOCK CARD
         ===================================================== -->

    <main class="card">


        <!-- =================================================
             LEFT SECTION
             Digital Clock + Location + Date
             ================================================= -->

        <section class="left">

            <!-- Digital Time -->
            <h1 id="digitalClock">
                00:00:00
            </h1>


            <!-- Location -->
            <div class="location-row">

                <h2 id="location">
                    📍 Detecting current location...
                </h2>

                <!-- Retry button
                     Hidden initially -->
                <button
                    id="locationRetry"
                    type="button"
                    class="hidden">

                    Retry

                </button>

            </div>


            <!-- Current Date -->
            <p id="date">
                Loading date...
            </p>

        </section>



        <!-- =================================================
             RIGHT SECTION
             Analog Clock
             ================================================= -->

        <section class="right">

            <canvas
                id="clock"
                width="220"
                height="220">
            </canvas>

        </section>


    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="script.js"></script>


</body>

</html>
