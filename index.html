<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="left">
            <h1 id="digitalClock">00:00:00</h1>
            <h2 id="location">📍 Detecting current location...</h2>
            <p id="date"></p>
        </div>
        <div class="right">
            <canvas id="clock" width="220" height="220"></canvas>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
